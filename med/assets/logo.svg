<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="medGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#medGrad)" opacity="0.15" stroke="url(#medGrad)" stroke-width="1.5"/>
  <!-- Caduceus / Stethoscope Cross Motif -->
  <circle cx="24" cy="24" r="18" stroke="url(#pulseGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Medical Cross / Pulse line -->
  <path d="M24 10V38M10 24H38" stroke="url(#medGrad)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- Pulse Line (ECG) -->
  <path d="M8 25H16L19 16L23 33L27 20L30 27L33 24H40" stroke="url(#pulseGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center Cap / Pip -->
  <circle cx="24" cy="12" r="2.5" fill="#38bdf8"/>
  <circle cx="24" cy="36" r="2.5" fill="#6366f1"/>
</svg>
